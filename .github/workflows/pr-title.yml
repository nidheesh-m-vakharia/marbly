name: PR title

# Squash merges use the PR title as the commit message, so titles follow
# Conventional Commits: type(scope): summary — e.g. "feat(app): window numbers".
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            style
            docs
            test
            build
            ci
            chore
          scopes: |
            app
            site
            sound
            dock
            settings
            repo
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Start the summary in lower case, e.g. "feat(app): add window numbers".
